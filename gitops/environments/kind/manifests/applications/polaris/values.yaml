image:
  repository: apache/polaris
  tag: "1.3.0-incubating"
  pullPolicy: IfNotPresent

metrics:
  enabled: true
  tags: {}

resources:
  requests:
    memory: "384Mi"
    cpu: "100m"
  limits:
    memory: "768Mi"
    cpu: "750m"

livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 12
  timeoutSeconds: 5
readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 5
  failureThreshold: 10
  timeoutSeconds: 3
startupProbe:
  httpGet:
    path: /q/health/live
    port: 8181
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 30
  timeoutSeconds: 3

extraEnv:
  - name: JAVA_OPTS_APPEND
    value: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
  - name: AWS_STORAGE_BUCKET
    value: s3://local-iceberg-test/kind-local/
  - name: AWS_REGION
    valueFrom:
      secretKeyRef:
        name: iceberg-bucket-credentials
        key: AWS_REGION
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: iceberg-bucket-credentials
        key: AWS_ACCESS_KEY
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: iceberg-bucket-credentials
        key: AWS_SECRET_KEY
persistence:
  type: relational-jdbc
  relationalJdbc:
    secret:
      name: polaris-postgres-credentials
      username: username
      password: password
      jdbcUrl: jdbcUrl

authentication:
  tokenBroker:
    secret:
      name: polaris-key-pair
      rsaKeyPair:
        publicKey: public.pem
        privateKey: private.pem

realmContext:
  realms:
    - polaris

features:
  DROP_WITH_PURGE_ENABLED: false

# This is an explicitly fresh catalog/database. It is only enabled in the
# isolated kind-local profile.
extraInitContainers:
  - name: polaris-bootstrap
    image: apache/polaris-admin-tool:1.3.0-incubating
    imagePullPolicy: IfNotPresent
    env:
      - name: ALLOW_POLARIS_BOOTSTRAP
        value: "true"
      - name: POLARIS_ROOT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: polaris-root-password
            key: polaris-root-password
      - name: POLARIS_PERSISTENCE_TYPE
        value: relational-jdbc
      - name: QUARKUS_DATASOURCE_USERNAME
        valueFrom:
          secretKeyRef:
            name: polaris-postgres-credentials
            key: username
      - name: QUARKUS_DATASOURCE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: polaris-postgres-credentials
            key: password
      - name: QUARKUS_DATASOURCE_JDBC_URL
        value: jdbc:postgresql://postgres-service:5432/kind_local
    command:
      - /bin/bash
      - -c
      - |
        set -e
        ACCEPTABLE_ERROR="already been bootstrapped"
        set +e
        OUTPUT=$(java -jar /deployments/polaris-admin-tool.jar bootstrap --realm=polaris --credential=polaris,root,${POLARIS_ROOT_PASSWORD} 2>&1)
        EXIT_CODE=$?
        set -e
        if [ ${EXIT_CODE} -eq 0 ]; then
          echo "Polaris bootstrap completed."
          exit 0
        fi
        if [[ "${OUTPUT}" == *"${ACCEPTABLE_ERROR}"* ]]; then
          echo "Polaris database is already bootstrapped."
          exit 0
        fi
        echo "Polaris bootstrap failed (exit ${EXIT_CODE})." >&2
        exit 1
