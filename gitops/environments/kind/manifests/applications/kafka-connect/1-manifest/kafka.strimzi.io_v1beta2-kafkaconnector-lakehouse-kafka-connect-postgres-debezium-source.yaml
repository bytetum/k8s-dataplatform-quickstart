apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  annotations:
    config-hash: 131bf0bc90c13206
  labels:
    strimzi.io/cluster: kind-local-kafka-connect
  name: postgres-debezium-source
  namespace: lakehouse-kafka-connect
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  config:
    database.dbname: ${env:POSTGRES_DB}
    database.hostname: postgres-m3-test.lakehouse-kafka-connect.svc.cluster.local
    database.password: ${env:POSTGRES_PASSWORD}
    database.port: "5432"
    database.user: ${env:POSTGRES_USER}
    errors.deadletterqueue.context.headers.enable: true
    errors.deadletterqueue.topic.name: kind-local.m3-debezium-errors
    errors.tolerance: all
    key.converter: io.confluent.connect.avro.AvroConverter
    key.converter.schema.registry.basic.auth.credentials.source: USER_INFO
    key.converter.schema.registry.basic.auth.user.info: ${env:SCHEMA_REGISTRY_USERNAME}:${env:SCHEMA_REGISTRY_PASSWORD}
    key.converter.schema.registry.url: http://warpstream-schema-registry-warpstream-agent.lakehouse-warpstream.svc.cluster.local:9094
    key.converter.schemas.enable: true
    max.batch.size: 2048
    max.queue.size: 8192
    plugin.name: pgoutput
    poll.interval.ms: 1000
    publication.name: kind_local_cdc_publication
    slot.name: kind_local_cdc_slot
    snapshot.mode: always
    table.include.list: public.csytab,public.cidmas,public.cidven
    topic.creation.default.cleanup.policy: compact
    topic.creation.default.min.compaction.lag.ms: 604800000
    topic.creation.default.partitions: 1
    topic.creation.default.replication.factor: 1
    topic.prefix: kind-local.m3-cdc
    transforms: unwrap,route
    transforms.route.regex: kind-local\.m3-cdc\.public\.(.*)
    transforms.route.replacement: kind-local.bronze.m3.$1
    transforms.route.type: org.apache.kafka.connect.transforms.RegexRouter
    transforms.unwrap.add.fields: op,source.ts_ms
    transforms.unwrap.add.headers: op,source.ts_ms
    transforms.unwrap.delete.handling.mode: rewrite
    transforms.unwrap.drop.tombstones: true
    transforms.unwrap.type: io.debezium.transforms.ExtractNewRecordState
    value.converter: io.confluent.connect.avro.AvroConverter
    value.converter.schema.registry.basic.auth.credentials.source: USER_INFO
    value.converter.schema.registry.basic.auth.user.info: ${env:SCHEMA_REGISTRY_USERNAME}:${env:SCHEMA_REGISTRY_PASSWORD}
    value.converter.schema.registry.url: http://warpstream-schema-registry-warpstream-agent.lakehouse-warpstream.svc.cluster.local:9094
    value.converter.schemas.enable: true
  tasksMax: 1
