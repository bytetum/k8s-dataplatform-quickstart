apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: secrets
  namespace: argocd
spec:
  destination:
    namespace: lakehouse-secrets
    server: https://kubernetes.default.svc
  project: default
  source:
    directory:
      exclude: values.yaml
      recurse: true
    path: gitops/environments/kind/manifests/applications/secrets
    repoURL: https://github.com/bytetum/k8s-dataplatform-quickstart.git
    targetRevision: master
