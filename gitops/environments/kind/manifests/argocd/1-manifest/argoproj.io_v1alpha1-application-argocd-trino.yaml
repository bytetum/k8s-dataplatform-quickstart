apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: trino
  namespace: argocd
spec:
  destination:
    namespace: lakehouse-trino
    server: https://kubernetes.default.svc
  project: default
  sources:
  - chart: trino
    helm:
      valueFiles:
      - $values/gitops/environments/kind/manifests/applications/trino/values.yaml
    repoURL: https://trinodb.github.io/charts
    targetRevision: 1.41.0
  - directory:
      exclude: values.yaml
      recurse: true
    path: gitops/environments/kind/manifests/applications/trino
    ref: values
    repoURL: https://github.com/bytetum/k8s-dataplatform-quickstart.git
    targetRevision: master
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
