apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: polaris
  namespace: argocd
spec:
  destination:
    namespace: lakehouse-polaris
    server: https://kubernetes.default.svc
  project: default
  sources:
  - chart: polaris
    helm:
      valueFiles:
      - $values/gitops/environments/kind/manifests/applications/polaris/values.yaml
    repoURL: https://downloads.apache.org/incubator/polaris/helm-chart
    targetRevision: 1.3.0-incubating
  - directory:
      exclude: values.yaml
      recurse: true
    path: gitops/environments/kind/manifests/applications/polaris
    ref: values
    repoURL: https://github.com/bytetum/k8s-dataplatform-quickstart.git
    targetRevision: master
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
