apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: secrets
  namespace: argocd
spec:
  destination:
    namespace: secrets
    server: https://kubernetes.default.svc
  project: default
  source:
    directory:
      recurse: true
    path: gitops/manifests/secrets
    repoURL: https://github.com/bytetum/k8s-dataplatform-quickstart.git
    targetRevision: mac-local
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
