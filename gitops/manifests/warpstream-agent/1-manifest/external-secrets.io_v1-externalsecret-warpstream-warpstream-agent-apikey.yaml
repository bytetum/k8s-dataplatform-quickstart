apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: warpstream-agent-apikey
  namespace: warpstream
spec:
  dataFrom:
  - extract:
      key: warpstream-agent-api-key
  secretStoreRef:
    kind: ClusterSecretStore
    name: local-kubernetes-secret-store
  target:
    creationPolicy: Owner
    name: warpstream-agent-apikey
